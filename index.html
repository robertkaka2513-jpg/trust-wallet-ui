<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Wallet</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #07110d;
  color: white;
  min-height: 100vh;
}

.wallet {
  width: 100%;
  max-width: 430px;
  min-height: 100vh;
  margin: auto;
  background: #0b1712;
  padding: 22px 18px 90px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 30px;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 20px;
  font-weight: bold;
}

.logo-icon {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: #34d399;
  color: #062015;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
}

.menu {
  font-size: 25px;
}

.balance-box {
  text-align: center;
  padding: 10px 0 25px;
}

.balance-title {
  color: #8fa39a;
  font-size: 14px;
  margin-bottom: 10px;
}

.balance {
  font-size: 38px;
  font-weight: bold;
}

.change {
  color: #35d58a;
  margin-top: 8px;
  font-size: 14px;
}

.actions {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 30px;
}

.action {
  border: 0;
  background: #13251d;
  color: white;
  border-radius: 15px;
  padding: 14px 5px;
  cursor: pointer;
  font-weight: bold;
}

.action-icon {
  display: block;
  font-size: 22px;
  margin-bottom: 7px;
}

.section-title {
  font-size: 19px;
  font-weight: bold;
  margin-bottom: 15px;
}

.asset {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #102019;
  border-radius: 16px;
  padding: 15px;
  margin-bottom: 10px;
}

.coin {
  display: flex;
  align-items: center;
  gap: 12px;
}

.coin-icon {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  font-weight: bold;
  background: #26382f;
}

.coin-name {
  font-weight: bold;
}

.coin-symbol {
  color: #84988e;
  font-size: 12px;
  margin-top: 4px;
}

.asset-right {
  text-align: right;
}

.asset-price {
  font-weight: bold;
}

.asset-change {
  color: #35d58a;
  font-size: 12px;
  margin-top: 4px;
}

.bottom {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 430px;
  height: 70px;
  background: #0d1b15;
  border-top: 1px solid #1d3027;
  display: flex;
  justify-content: space-around;
  align-items: center;
}

.nav {
  text-align: center;
  color: #71847b;
  font-size: 12px;
}

.nav.active {
  color: #35d58a;
}

.nav-icon {
  display: block;
  font-size: 21px;
  margin-bottom: 4px;
}

button:active {
  transform: scale(.97);
}
</style>
</head>

<body>

<div class="wallet">

  <div class="header">
    <div class="logo">
      <div class="logo-icon">W</div>
      My Wallet
    </div>
    <div class="menu">⋮</div>
  </div>

  <div class="balance-box">
    <div class="balance-title">Total Balance</div>
    <div class="balance">$10,542.28</div>
    <div class="change">▲ 2.41% Today</div>
  </div>

  <div class="actions">
    <button class="action" onclick="alert('Demo Send screen')">
      <span class="action-icon">↑</span>
      Send
    </button>

    <button class="action" onclick="alert('Demo Receive screen')">
      <span class="action-icon">↓</span>
      Receive
    </button>

    <button class="action" onclick="alert('Demo Swap screen')">
      <span class="action-icon">⇄</span>
      Swap
    </button>
  </div>

  <div class="section-title">Your Assets</div>

  <div class="asset">
    <div class="coin">
      <div class="coin-icon">₿</div>
      <div>
        <div class="coin-name">Bitcoin</div>
        <div class="coin-symbol">BTC</div>
      </div>
    </div>

    <div class="asset-right">
      <div class="asset-price">$5,240.20</div>
      <div class="asset-change">+1.82%</div>
    </div>
  </div>

  <div class="asset">
    <div class="coin">
      <div class="coin-icon">Ξ</div>
      <div>
        <div class="coin-name">Ethereum</div>
        <div class="coin-symbol">ETH</div>
      </div>
    </div>

    <div class="asset-right">
      <div class="asset-price">$2,830.50</div>
      <div class="asset-change">+3.21%</div>
    </div>
  </div>

  <div class="asset">
    <div class="coin">
      <div class="coin-icon">BNB</div>
      <div>
        <div class="coin-name">BNB</div>
        <div class="coin-symbol">BNB</div>
      </div>
    </div>

    <div class="asset-right">
      <div class="asset-price">$1,120.30</div>
      <div class="asset-change">+1.12%</div>
    </div>
  </div>

  <div class="asset">
    <div class="coin">
      <div class="coin-icon">₮</div>
      <div>
        <div class="coin-name">Tether</div>
        <div class="coin-symbol">USDT</div>
      </div>
    </div>

    <div class="asset-right">
      <div class="asset-price">$1,351.28</div>
      <div class="asset-change">0.00%</div>
    </div>
  </div>

</div>

<div class="bottom">
  <div class="nav active">
    <span class="nav-icon">⌂</span>
    Home
  </div>

  <div class="nav">
    <span class="nav-icon">⇄</span>
    Swap
  </div>

  <div class="nav">
    <span class="nav-icon">◷</span>
    Activity
  </div>
</div>

</body>
</html>
